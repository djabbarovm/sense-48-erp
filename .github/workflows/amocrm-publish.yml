# ОДНОРАЗОВЫЙ: забрать готовый артефакт amocrm-extract (Azure доступен из раннера, из песочницы — нет)
# и положить пакет в ОТДЕЛЬНУЮ orphan-ветку данных `amocrm-extract-data`, чтобы его можно было
# подтянуть по git. Ветка временная и удаляется после доставки. Данные в код-историю НЕ попадают.
name: amoCRM Publish
on:
  push:
    branches: [claude/own-it-product-w1ij9b]
    paths:
      - '.github/workflows/amocrm-publish.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Скачать артефакт из успешного extract-прогона
        uses: actions/download-artifact@v4
        with:
          name: amocrm-extract
          run-id: 35587749350
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _amocrm_data
      - name: Опубликовать в orphan-ветку данных
        run: |
          set -e
          git config user.name "amocrm-extract-bot"
          git config user.email "noreply@anthropic.com"
          git checkout --orphan amocrm-extract-data
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 -mindepth 1 ! -name '_amocrm_data' ! -name '.git' -exec rm -rf {} +
          mv _amocrm_data/* . 2>/dev/null || true
          rmdir _amocrm_data 2>/dev/null || true
          git add -A
          git commit -m "amoCRM extract package (data-only temporary branch)"
          git push -f origin amocrm-extract-data
