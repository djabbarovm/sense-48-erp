# H-06: оверлей для доступа по IP без домена (HTTP на :80).
# Когда появится домен — убрать этот оверлей и поставить caddy/nginx c TLS.
services:
  web:
    ports:
      - '80:3000'
    volumes:
      - ./data:/app/data
    environment:
      # без TLS secure-cookie не выживает — сессия сбрасывается на каждом переходе
      AUTH_COOKIE_SECURE: 'false'
