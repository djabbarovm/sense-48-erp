# H-06/H-09/H-11: оверлей сервера (DigitalOcean).
# Внешний вход — ТОЛЬКО через Caddy c TLS (443). Порт 3000 web остаётся на loopback
# для health-check деплоя. HTTP:80 нужен Caddy для ACME-challenge и редиректа на https.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

  web:
    ports: !override
      - '127.0.0.1:3000:3000'
    volumes:
      - ./data:/app/data
    environment:
      AUTH_COOKIE_SECURE: 'true'
      APP_URL: https://${PUBLIC_HOST:?}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}

  workers:
    environment:
      APP_URL: https://${PUBLIC_HOST:?}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}

volumes:
  caddydata:
  caddyconfig:
