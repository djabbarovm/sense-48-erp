# H-06/H-09: оверлей сервера. Внешний вход ЗАКРЫТ до включения HTTPS
# (решение владельца 15.09: реальные финансовые данные по HTTP не гоняем).
# После настройки домена и Caddy: вернуть публикацию через caddy 443.
services:
  web:
    ports: !override
      - '127.0.0.1:3000:3000'
    volumes:
      - ./data:/app/data
    environment:
      # вернётся в true вместе c HTTPS
      AUTH_COOKIE_SECURE: 'false'
